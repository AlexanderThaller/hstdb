[package]
name = "hstdb"
version = "3.0.0"
authors = ["Alexander Thaller <alexander.thaller@trivago.com>"]

edition = "2024"
rust-version = "1.89.0"

description = "Better history management for zsh."
documentation = "https://docs.rs/hstdb/"
license = "MIT"
readme = "README.md"
repository = "https://github.com/AlexanderThaller/hstdb"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["histdb-import", "sqlite-cache"]
histdb-import = ["dep:rusqlite"]
sqlite-cache = ["dep:rusqlite"]
generate-readme = ["dep:askama"]

[dependencies]
askama = { version = "0.16", optional = true }
bitcode = { version = "0.6", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap_complete = "4"
clap = { version = "4", features = ["derive", "env"] }
color-eyre = "0.6"
comfy-table = "8"
crossbeam-utils = "0.8"
csv = "1"
ctrlc = { version = "3", features = ["termination"] }
directories = "6"
env_logger = { version = "0.11", default-features = false, features = [
  "color",
] }
flume = "0.12"
glob = "0.3"
hostname = "0.4"
humantime = "2"
log = { version = "0.4", features = ["serde"] }
regex = "1"
rusqlite = { version = "0.40", optional = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"
unused_lifetimes = "warn"

[lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
pedantic = { level = "warn", priority = -1 }
todo = "warn"
unwrap_used = "warn"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
wildcard_enum_match_arm = "warn"
disallowed_methods = "deny"

[profile.release]
debug = true

[profile.deploy]
codegen-units = 1
debug = false
incremental = false
inherits = "release"
lto = true
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.fastdev]
inherits = "release"
debug-assertions = true
